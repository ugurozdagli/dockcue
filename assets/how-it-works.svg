<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif} .muted{fill:#97abc1}.white{fill:#edf5ff}.cyan{fill:#3bdbdf}</style><title>DockCue connects your headset controls to Windows playback through the local USB base and G HUB</title><rect width="1200" height="300" rx="20" fill="#101927"/><text x="36" y="48" class="white" font-size="22" font-weight="600">Your existing USB setup. A few extra controls.</text><rect x="36" y="84" width="352" height="138" rx="14" fill="#182638" stroke="#2d4359"/><text x="56" y="118" class="cyan" font-size="14">01</text><text x="56" y="153" class="white" font-size="22" font-weight="600">ASTRO A50 X</text><text x="56" y="185" class="muted" font-size="14">Flip the mic · press Voice / Game</text><rect x="424" y="84" width="352" height="138" rx="14" fill="#182638" stroke="#2d4359"/><text x="444" y="118" class="cyan" font-size="14">02</text><text x="444" y="153" class="white" font-size="22" font-weight="600">DockCue + local G HUB</text><text x="444" y="185" class="muted" font-size="14">Read USB events · center the mix</text><rect x="812" y="84" width="352" height="138" rx="14" fill="#182638" stroke="#2d4359"/><text x="832" y="118" class="cyan" font-size="14">03</text><text x="832" y="153" class="white" font-size="22" font-weight="600">Windows media session</text><text x="832" y="185" class="muted" font-size="14">Play / pause in your media app</text><path d="M394 153h21m-7-6 7 6-7 6" fill="none" stroke="#3bdbdf" stroke-width="2"/><path d="M782 153h21m-7-6 7 6-7 6" fill="none" stroke="#3bdbdf" stroke-width="2"/><text x="36" y="265" class="muted" font-size="14">G HUB is required for media control. Microphone cues work without it. No Bluetooth connection to the PC is needed.</text></svg>