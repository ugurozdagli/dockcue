<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif} .muted{fill:#97abc1}.white{fill:#edf5ff}.cyan{fill:#3bdbdf}</style><title>DockCue 1.2.1 compact interface overview — illustration</title><rect width="1100" height="680" rx="20" fill="#101927"/><text x="48" y="65" class="cyan" font-size="15" letter-spacing="2">THE COMPACT INTERFACE</text><text x="48" y="108" class="white" font-size="30" font-weight="600">Everyday controls up front.</text><text x="48" y="139" class="muted" font-size="16">420 × 510 main window · extra settings stay folded away</text><g transform="translate(650 35)"><rect width="410" height="607" rx="16" fill="#0d121a" stroke="#3a5065"/><path d="M0 35h410" stroke="#26364b"/><text x="15" y="24" class="white" font-size="12">DockCue</text><text x="382" y="24" class="muted" font-size="16">×</text><text x="22" y="80" class="white" font-size="25">DockCue</text><circle cx="318" cy="73" r="3" fill="#79d9b1"/><text x="328" y="78" fill="#79d9b1" font-size="11">Running</text><text x="22" y="103" class="muted" font-size="11">Logitech G ASTRO A50 X</text><text x="385" y="103" text-anchor="end" class="muted" font-size="11">v1.2.1</text><rect x="18" y="120" width="374" height="93" rx="12" fill="#18212d"/><text x="30" y="147" class="white" font-size="13">Base connected by USB</text><text x="380" y="147" text-anchor="end" class="cyan" font-size="14">Battery 90%</text><text x="30" y="173" class="muted" font-size="11">Last reported microphone state: Microphone muted</text><text x="30" y="196" class="muted" font-size="11">Off charging dock · last reported</text><rect x="18" y="223" width="374" height="79" rx="12" fill="#18212d"/><text x="30" y="250" class="white" font-size="14">Microphone cues</text><rect x="340" y="237" width="36" height="20" rx="10" fill="#31d0dc"/><circle cx="367" cy="247" r="9" fill="#e3edf7"/><text x="30" y="282" class="muted" font-size="11">30%</text><path d="M70 278H283" stroke="#526478" stroke-width="4"/><path d="M70 278H226" stroke="#31d0dc" stroke-width="4"/><circle cx="226" cy="278" r="6" fill="#31d0dc"/><rect x="309" y="266" width="67" height="24" rx="6" fill="#29394d"/><text x="342" y="282" text-anchor="middle" class="white" font-size="11">Preview</text><rect x="18" y="312" width="374" height="126" rx="12" fill="#18212d"/><text x="30" y="339" class="white" font-size="14">Media control</text><rect x="340" y="326" width="36" height="20" rx="10" fill="#31d0dc"/><circle cx="367" cy="336" r="9" fill="#e3edf7"/><text x="30" y="361" class="muted" font-size="11">Play / pause · G HUB ready</text><rect x="30" y="374" width="120" height="29" rx="6" fill="#29394d"/><rect x="33" y="377" width="58" height="23" rx="4" fill="#146c79"/><text x="62" y="393" text-anchor="middle" class="white" font-size="11">Voice</text><text x="120" y="393" text-anchor="middle" class="white" font-size="11">Game</text><rect x="225" y="374" width="151" height="29" rx="6" fill="#29394d"/><text x="301" y="393" text-anchor="middle" class="white" font-size="11">Center game / voice</text><text x="30" y="425" class="muted" font-size="11">Media on · mix always returns to center</text><text x="30" y="472" class="muted" font-size="12">Settings &amp; log  ⌄</text><rect x="261" y="451" width="115" height="29" rx="6" fill="#203246"/><text x="319" y="470" text-anchor="middle" class="white" font-size="11">Hide to tray</text><text x="24" y="509" class="muted" font-size="10">Independent companion · not affiliated with Logitech / ASTRO</text><text x="24" y="532" fill="#76baa9" font-size="10">AI-assisted · no recording or telemetry</text><text x="205" y="578" text-anchor="middle" class="muted" font-size="11">Illustration · sample values · not a screenshot</text></g><circle cx="68" cy="210" r="20" fill="#193b48"/><text x="68" y="215" text-anchor="middle" class="cyan" font-size="12">01</text><text x="105" y="215" class="white" font-size="21" font-weight="600">Status, with context</text><text x="105" y="244" class="muted" font-size="15">USB base, microphone state and battery.</text><text x="105" y="268" class="muted" font-size="15">Dock information is always last reported.</text><circle cx="68" cy="332" r="20" fill="#193b48"/><text x="68" y="337" text-anchor="middle" class="cyan" font-size="12">02</text><text x="105" y="337" class="white" font-size="21" font-weight="600">Hear the microphone</text><text x="105" y="366" class="muted" font-size="15">Separate open / mute cues.</text><text x="105" y="390" class="muted" font-size="15">Adjust volume or preview both sounds.</text><circle cx="68" cy="454" r="20" fill="#193b48"/><text x="68" y="459" text-anchor="middle" class="cyan" font-size="12">03</text><text x="105" y="459" class="white" font-size="21" font-weight="600">Choose your button</text><text x="105" y="488" class="muted" font-size="15">Voice or Game sends play / pause.</text><text x="105" y="512" class="muted" font-size="15">Center the mix with one click.</text><circle cx="68" cy="576" r="20" fill="#193b48"/><text x="68" y="581" text-anchor="middle" class="cyan" font-size="12">04</text><text x="105" y="581" class="white" font-size="21" font-weight="600">Quietly in the tray</text><text x="105" y="610" class="muted" font-size="15">Close the window and keep using it.</text><text x="105" y="634" class="muted" font-size="15">Expand settings for language, startup and logs.</text></svg>